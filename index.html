  <template id="content-projects">
    <h1>Projects</h1><p class="lead">Prototypes, coursework, and independent projects.</p>
    <nav class="project-nav" aria-label="Jump to a project">
      <button data-open="projects" data-anchor="uniloop">UniLoop</button>
      <button data-open="projects" data-anchor="plain-law">Plain Law</button>

      <button data-open="projects" data-anchor="javafx">JavaFX</button>

      <button data-open="projects" data-anchor="financial-assistance">Financial Assistance</button>
    </nav>
    <div class="cards">
      <article class="featured" data-topic="uniloop">
        <p class="tag">HACKATHON PROTOTYPE · NODE.JS · JAVASCRIPT</p><h2>UniLoop</h2>
        <p>University students need a way to join clubs and book events, while club organisers need to keep track of member pricing and RSVPs. UniLoop puts those tasks in one place.</p>
        <p>The prototype applies member pricing automatically and gives club organisers a dashboard for memberships and RSVPs. Payments are simulated.</p>
        <button data-open="hackathons" data-anchor="competition">See the competition photos</button>
      </article>
      <article class="featured" data-topic="plain-law">
        <p class="tag">NEXT.JS · TYPESCRIPT · CLAUDE API</p><h2>Plain Law</h2>
        <p>I built Plain Law with assistance from Claude to help people understand dense legal documents. It explains documents in plain English and highlights dates and amounts a reader might otherwise miss.</p>
        <p>Readers can request source checking when they want to verify a point in the explanation against the document.</p>
      </article>
      <article data-topic="shopper">
        <p class="tag">UTS GROUP PROJECT · RANDOM FOREST</p><h2>Online Shopper Prediction</h2>
        <p>Our group explored whether session data could help an online retailer identify visitors likely to buy. The random forest baseline had about 84% accuracy while missing every buyer.</p>
        <p>Buyer recall measures how many actual buyers the model identifies. A model can score well on overall accuracy by favouring the more common non-buyer class, yet still miss every session the retailer wants to identify.</p>
      </article>
      <article data-topic="javafx">
        <p class="tag">UTS COURSEWORK · JAVA · JAVAFX</p><h2>JavaFX Coursework</h2>
        <p>I worked on Java desktop interfaces that respond to user actions and stay in sync as their state changes. Event handlers respond to input, observable properties allow views to react to changes, and model–view–controller keeps data, presentation, and interaction organised.</p>
      </article>
      <article data-topic="web-systems">
        <p class="tag">UTS WEB SYSTEMS (31268) · HTML · CSS</p><h2>Web Systems Website</h2>
        <p>I designed and built a responsive website from scratch for my UTS Web Systems coursework. I used HTML to structure the content and CSS to adapt the layout to different screen sizes, so readers could use the site on desktop and mobile.</p>
      </article>
      <article data-topic="gym-finder">
        <p class="tag">PERSONAL PROJECT · ORACLE APEX</p><h2>Gym Finder Web Application</h2>
        <p>I built a web application for people looking to find and compare gyms across several criteria, with a simple, consistent interface. I presented it to a live audience, answered questions about the design, and used the feedback to refine the app.</p>
      </article>
      <article data-topic="financial-assistance">
        <p class="tag">SCHOOL PROJECT · FIGMA · RESEARCH REPORT</p><h2>Financial Assistance Website</h2>
        <p>I researched and designed a Figma prototype to help Australians navigate financial decisions. I focused on user needs, navigation, and task completion, then documented my research and design decisions in a report for stakeholders.</p>
      </article>
    </div>
  </template>
